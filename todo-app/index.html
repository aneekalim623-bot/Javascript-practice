<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Professional Todo App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Navbar */
        navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background-color: #0f172a;
            border-bottom: 3px solid #facc15;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #facc15;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #f8fafc;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #facc15;
        }

        .btn-signin {
            background-color: #facc15;
            color: #0f172a !important;
            padding: 9px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .btn-signin:hover {
            background-color: #eab308 !important;
            transform: translateY(-1px);
        }

        /* Main Container */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            flex-grow: 1;
        }

        /* Todo Card */
        .todo-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 460px;
            border-radius: 16px;
            border: 2px solid #0f172a;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
            overflow: hidden;
        }

        .card-header {
            background-color: #facc15;
            color: #0f172a;
            padding: 18px 20px;
            text-align: center;
            font-weight: 800;
            font-size: 19px;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #0f172a;
        }

        .card-body {
            padding: 25px;
        }

        .form-todo {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 20px;
        }

        .form-todo input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            background-color: #f1f5f9;
            border: 2px solid #0f172a;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            color: #0f172a;
            font-weight: 600;
        }

        .btn-add {
            background-color: #0f172a;
            color: #facc15;
            border: 2px solid #0f172a;
            padding: 11px 22px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            align-self: center;
            transition: transform 0.2s, background 0.2s;
        }

        .btn-add:hover {
            background-color: #facc15;
            color: #0f172a;
            transform: translateY(-2px);
        }

        /* Filter Controls & Counters */
        .filter-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        .filter-buttons {
            display: flex;
            gap: 6px;
        }

        .filter-btn {
            background: none;
            border: 1px solid #cbd5e1;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            color: #475569;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background-color: #0f172a;
            color: #facc15;
            border-color: #0f172a;
        }

        .clear-btn {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .clear-btn:hover {
            text-decoration: underline;
        }

        .task-counter {
            font-size: 13px;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 12px;
        }

        /* Task List */
        .todo-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .todo-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background-color: #f8fafc;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }

        .text {
            font-size: 15px;
            color: #0f172a;
            font-weight: 700;
        }

        .done-text {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .todo-buttons {
            display: flex;
            gap: 6px;
        }

        .btn-action {
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 6px;
        }

        .done-btn {
            color: #0f172a;
            background-color: #facc15;
        }

        .delete-btn {
            color: #ffffff;
            background-color: #ef4444;
        }

        /* Footer */
        footer {
            background-color: #0f172a;
            border-top: 3px solid #facc15;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #94a3b8;
        }

        .footer-links a {
            color: #facc15;
            text-decoration: none;
            margin-left: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        /* MODAL POPUPS STYLING */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.75);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: #ffffff;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 16px;
            border: 3px solid #facc15;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 22px;
            font-weight: 800;
            cursor: pointer;
            color: #0f172a;
        }

        .modal-content h3 {
            margin-bottom: 20px;
            font-size: 20px;
            color: #0f172a;
            text-align: center;
        }

        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-form input, .modal-form textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #0f172a;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .modal-form button {
            background-color: #0f172a;
            color: #facc15;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <navbar>
        <div class="logo">TaskFlow</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a id="contactLink">Contact Us</a>
            <a id="signinBtn" class="btn-signin">Sign In</a>
        </div>
    </navbar>

    <!-- Main Container -->
    <div class="main-container">
        <div class="todo-card">
            <div class="card-header">
                Website todo
            </div>

            <div class="card-body">
                <form class="form-todo">
                    <input type="text" placeholder="Add a new task..." required />
                    <input type="submit" value="+ New Task" class="btn-add" />
                </form>

                <!-- Filter Controls & Counter -->
                <div class="filter-section">
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="active">Active</button>
                        <button class="filter-btn" data-filter="completed">Completed</button>
                    </div>
                    <button class="clear-btn" id="clearCompletedBtn">Clear Completed</button>
                </div>

                <div class="task-counter" id="taskCounter">0 tasks remaining</div>

                <ul class="todo-list">
                    <!-- Dynamic tasks -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Sign In Popup Modal -->
    <div id="signinModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeSignin">&times;</span>
            <h3>Sign In to TaskFlow</h3>
            <form class="modal-form" onsubmit="alert('Logged In Successfully!'); document.getElementById('signinModal').style.display='none'; return false;">
                <input type="email" placeholder="Email Address" required />
                <input type="password" placeholder="Password" required />
                <button type="submit">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Contact Us Popup Modal -->
    <div id="contactModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeContact">&times;</span>
            <h3>Contact Support</h3>
            <form class="modal-form" onsubmit="alert('Message Sent Successfully!'); document.getElementById('contactModal').style.display='none'; return false;">
                <input type="text" placeholder="Your Name" required />
                <input type="email" placeholder="Your Email" required />
                <textarea rows="3" placeholder="Your Message..." required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div>© 2026 TaskFlow. All rights reserved.</div>
        <div class="footer-links">
            <span>Need help?</span>
            <a id="footerContact">Contact Support</a>
        </div>
    </footer>

    <!-- Linked JS File -->
    <script src="todo.js"></script>
</body>
</html>
